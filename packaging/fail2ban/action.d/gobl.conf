# Fail2Ban action: gobl
#
# Temporary bans go into the nftables set f2b_temp (f2b_temp6 for IPv6).
# IPs banned often enough (see permaban_retry in /etc/gobl/gobl.conf) go
# into f2b_perm (f2b_perm6) instead. Your nftables ruleset decides what
# happens to traffic from those sets; see the gobl README.
#
# Install as /etc/fail2ban/action.d/gobl.conf and use it in jail.local:
#
#   [DEFAULT]
#   banaction = gobl
#   banaction_allports = gobl

[INCLUDES]

[Definition]

# Create missing sets, restore permabans from gobl's database.
actionstart = /usr/local/sbin/gobl init

# Flush the temporary sets. Permabans stay.
actionstop = /usr/local/sbin/gobl flush

actioncheck =

# <restored> is 1 when fail2ban re-applies a ban after a restart; gobl then
# does not count it as a new offence.
actionban = /usr/local/sbin/gobl ban <ip> --jail <name> --restored <restored>

actionunban = /usr/local/sbin/gobl unban <ip> --jail <name>

[Init]

name = default
